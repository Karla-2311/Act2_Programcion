<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utilería - Login</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="contenedor">
  <p class="saludo" id="saludo"></p>
  <h1>Iniciar sesión</h1>
  <p class="subtitulo">Accede con tu correo y contraseña validados.</p>

  <form id="formLogin" novalidate>
    <label for="correo">Correo electrónico</label>
    <input type="text" id="correo" placeholder="Ej. karla@correo.com">
    <div class="error" id="errorCorreo"></div>

    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="Mínimo 8 caracteres">
    <div class="error" id="errorPassword"></div>
    <div class="error" id="mensajeExito" style="color:#2a9d8f;"></div>

    <button type="submit">Entrar</button>
  </form>

  <a class="enlace" href="index.html">¿No tienes cuenta? Regístrate</a>
</div>

<script src="js/utileria.js"></script>
<script src="js/login.js"></script>
</body>
</html>
