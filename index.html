<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utilería - Formulario</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="contenedor">
  <p class="saludo" id="saludo"></p>
  <h1>Registro de usuario</h1>
  <p class="subtitulo">Usa la librería Utileria para validar tus datos</p>

  <form id="formRegistro" novalidate>
    <label for="nombre">Nombre completo</label>
    <input type="text" id="nombre" placeholder="Ej. Karla Antonio">
    <div class="error" id="errorNombre"></div>

    <label for="correo">Correo electrónico</label>
    <input type="text" id="correo" placeholder="Ej. karla@correo.com">
    <div class="error" id="errorCorreo"></div>

    <label for="telefono">Teléfono (máximo 10 dígitos)</label>
    <input type="text" id="telefono" placeholder="Ej. 9512684752">
    <div class="error" id="errorTelefono"></div>

    <label for="fechaNacimiento">Fecha de nacimiento</label>
    <input type="date" id="fechaNacimiento">
    <div class="error" id="errorFecha"></div>

    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="Mínimo 8 caracteres">
    <div class="error" id="errorPassword"></div>
    <div class="error" id="mensajeExito" style="color:#2a9d8f;"></div>

    <button type="submit">Registrarme</button>
  </form>

  <a class="enlace" href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
</div>

<!-- Modal que muestra la edad calculada -->
<div class="modal-fondo" id="modalEdad">
  <div class="modal-caja">
    <h2 id="modalNombre">¡Registro exitoso!</h2>
    <p id="modalTexto">Tu edad calculada es:</p>
    <p style="font-size:2rem; font-weight:bold;" id="modalEdadValor">--</p>
    <p id="modalCumple" style="font-size:0.85rem;"></p>
    <p id="modalZodiaco" style="font-size:0.85rem;"></p>
    <button id="cerrarModal">Cerrar</button>
  </div>
</div>

<script src="js/utileria.js"></script>
<script src="js/index.js"></script>
</body>
</html>
